name: Publish static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.METADATA_REUSE_CLEARED == 'true' && vars.PAGES_DEPLOYMENT_AUTHORIZED == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site files
        run: |
          mkdir -p _site
          cp *.html favicon.ico site.webmanifest _site/
          cp -R src data assets _site/
          find _site -name AGENTS.md -type f -delete
      - name: Upload only the static application
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
