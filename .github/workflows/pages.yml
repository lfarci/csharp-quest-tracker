name: Publish static site to GitHub Pages

# Deploy on updates to main, or allow an explicit manual deployment.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site files
        run: |
          mkdir -p _site
          cp *.html favicon.ico site.webmanifest sitemap.xml _site/
          test -f _site/sitemap.xml
          cp -R src data assets _site/
          find _site -name AGENTS.md -type f -delete
      - name: Upload only the static application
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
