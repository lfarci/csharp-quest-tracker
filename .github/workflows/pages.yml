name: Publish static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site files
        run: |
          mkdir -p _site
          cp *.html styles.css favicon.svg favicon.ico favicon-16x16.png favicon-32x32.png apple-touch-icon.png android-chrome-192x192.png android-chrome-512x512.png site.webmanifest _site/
          cp -R src data _site/
      - name: Upload only the static application
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
